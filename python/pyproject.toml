[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradia"
version = "0.1.0"
description = "Agentic trading intelligence — trade proposals, risk checks, journals, performance reports, and public accountability updates"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Talocode"}]
keywords = ["trading", "forex", "crypto", "risk-management", "journal", "backtesting", "talocode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/talocode/tradia"
PyPI = "https://pypi.org/project/tradia/"
npm = "https://www.npmjs.com/package/@talocode/tradia"

[project.scripts]
tradia = "tradia.__main__:main"
